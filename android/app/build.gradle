plugins { id "com.android.application" }
def vc = Integer.parseInt((project.findProperty("vCode") ?: "1").toString())
android {
    namespace "app.joshiscorner.care"
    compileSdk 34
    defaultConfig {
        applicationId "app.joshiscorner.care"
        minSdk 24
        targetSdk 34
        versionCode vc
        versionName "1.0." + vc
    }
    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_FILE")
            if (ks) { storeFile file(ks); storePassword System.getenv("KEY_PASS"); keyAlias "jcggcare"; keyPassword System.getenv("KEY_PASS") }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
