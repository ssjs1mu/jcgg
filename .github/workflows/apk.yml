name: Build JCGG Care APK
on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/apk.yml"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/care.jks
          KEY_PASS: jcggcare
        run: gradle --no-daemon assembleRelease -PvCode=${{ github.run_number }}
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk JCGG-Care.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest JCGG-Care.apk --title "JCGG Care (Android)" --notes "Install JCGG-Care.apk on the phone. The app always opens the latest web version."
